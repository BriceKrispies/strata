# Concordance for Strata. The specification is specifications/spec.jsonc, one Exegra file.
# Concordance renders its documents under their own paths (specifications/<area>/<file>.md),
# so the globs below name those documents; no Markdown file exists on disk.
spec_roots = ["specifications"]
src_roots = ["crates", "lean"]
test_results = ["var/test-results/cargo-test.txt", "var/test-results/lake-build.txt"]

[authority]
normative = ["specifications/index.md", "specifications/glossary.md", "specifications/0[1-9]-*/**"]
descriptive = ["specifications/00-vision/**"]

[lint]
whitepaper = "specifications/00-vision/whitepaper.md"
strict = true
require_milestone = true
spec = ["specifications/index.md", "specifications/glossary.md", "specifications/0[1-9]-*/**"]

# Milestones whose requirements the gate holds the code to. A requirement of a later milestone
# is reported as planned and is not checked against the code. Add a milestone here when work on it
# starts: from then on every requirement of it must have a passing proof (scripts/spec-gate.mjs).
[gate]
started_milestones = [1]

[semantic]
enabled = false

[server]
port = 4174
