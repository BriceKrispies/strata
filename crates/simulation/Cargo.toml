[package]
autotests = false
name = "strata-simulation"
description = "Deterministic discrete-event simulation of Strata: the deployment's own shell code over the store contract with logical time and seeded faults, kernel-level counterfactual branching, traces, replay."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
strata-kernel.workspace = true
strata-storage-api.workspace = true
strata-verification.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
strata-kernel = { workspace = true, features = ["testkit"] }
strata-substrate.workspace = true
strata-protocol.workspace = true
# The deployment the shell path runs: the backend implements `shell::Deploy`. A dev-dependency
# only, since the backend depends on this crate's library (its Impact Lab).
strata-backend.workspace = true

[[test]]
name = "simulation_slow"
path = "tests/simulation_slow.rs"

[lints]
workspace = true
