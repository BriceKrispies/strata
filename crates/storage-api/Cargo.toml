[package]
name = "strata-storage-api"
description = "The persistence contract of Strata, a reference in-memory adapter, and the adapter conformance suite."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The reusable adapter conformance suite. Adapters enable this in their dev-dependencies.
conformance = ["strata-kernel/testkit"]

[dependencies]
strata-kernel.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
strata-storage-api = { path = ".", features = ["conformance"] }

[lints]
workspace = true
