[package]
autotests = false
name = "strata-storage-sqlite"
description = "SQLite implementation of the Strata persistence contract."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
strata-kernel.workspace = true
strata-storage-api.workspace = true
strata-runtime.workspace = true
serde.workspace = true
serde_json.workspace = true
rusqlite.workspace = true

[dev-dependencies]
strata-storage-api = { workspace = true, features = ["conformance"] }
strata-kernel = { workspace = true, features = ["testkit"] }
# Reads the conformance table from the specification manifest.
strata-spec-parts.workspace = true
# The publication template, for the recorded-data test.
strata-substrate.workspace = true

[[test]]
name = "storage_sqlite_it"
path = "tests/storage_sqlite_it.rs"

[[test]]
name = "storage_sqlite_slow"
path = "tests/storage_sqlite_slow.rs"

[lints]
workspace = true
