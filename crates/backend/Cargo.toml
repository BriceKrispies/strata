[package]
name = "strata-backend"
description = "The Strata backend service: sessions, kernel execution, atomic commits, outbox publication, subscriptions, simulation runs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The development routes (`/internal/dev/*`) and nothing else. Off in a production build; `STRATA_DEV=1`
# is refused by a binary built without it.
development = []

[dependencies]
strata-runtime.workspace = true
strata-kernel.workspace = true
strata-substrate.workspace = true
strata-storage-api.workspace = true
strata-storage-sqlite.workspace = true
strata-machine-store.workspace = true
strata-protocol.workspace = true
strata-simulation.workspace = true
strata-verification.workspace = true
strata-model.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
axum.workspace = true
futures-util.workspace = true
argon2.workspace = true
getrandom.workspace = true
unicode-normalization.workspace = true
webauthn-rs.workspace = true
base64.workspace = true
lettre.workspace = true
jsonwebtoken.workspace = true
totp-rs.workspace = true
bergshamra-dsig.workspace = true
bergshamra-keys.workspace = true
uppsala.workspace = true
flate2.workspace = true
sha2.workspace = true
jiff.workspace = true
reqwest = { workspace = true, features = ["native-tls"] }
# Pure-Rust cryptography (RustCrypto), as the SAML and RSA code uses: no C library to build.
p256 = { version = "=0.13.2", features = ["pkcs8", "pem", "ecdsa"] }
aes-gcm = "=0.10.3"

[dev-dependencies]
webauthn-authenticator-rs = { version = "=0.6.2", default-features = false, features = ["softpasskey"] }
tokio-tungstenite.workspace = true
# The notes fixture the automation worker's tests run on.
strata-kernel = { workspace = true, features = ["testkit"] }

# These drive the running service through the development routes.
[[test]]
name = "service"
required-features = ["development"]

[[test]]
name = "tokens"
required-features = ["development"]

[lints]
workspace = true
