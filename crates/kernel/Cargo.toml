[package]
autotests = false
name = "strata-kernel"
description = "Pure, deterministic state-transition kernel for Strata. No I/O, no clock, no randomness."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Exposes `testkit`, a small fixture world, to downstream test code.
testkit = []

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
# The kernel's data types, generated from the specification. Pure: serde, serde_json, regex and
# uuid with its serde feature only (KRN-012).
strata-model-core.workspace = true
# Normalisation on write (WG-5597): Unicode NFC, and the emoji properties of the VS16 form. Pure data.
unicode-normalization.workspace = true
unicode-properties.workspace = true

[dev-dependencies]
proptest.workspace = true
strata-kernel = { path = ".", features = ["testkit"] }

[[test]]
name = "kernel_it"
path = "tests/kernel_it.rs"

[[test]]
name = "kernel_slow"
path = "tests/kernel_slow.rs"

[lints]
workspace = true
