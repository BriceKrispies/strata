[package]
autotests = false
name = "strata-bff"
description = "The Strata backend-for-frontend: the browser's only entry point. Cookies, CSRF, origin checks, view-model projection, WebSocket relay, static assets."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
strata-runtime.workspace = true
strata-kernel.workspace = true
strata-substrate.workspace = true
strata-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
axum.workspace = true
futures-util.workspace = true
reqwest.workspace = true
tokio-tungstenite.workspace = true
tower-http.workspace = true
getrandom.workspace = true
sha2.workspace = true

[dev-dependencies]
strata-backend = { path = "../backend" }
strata-storage-api.workspace = true
strata-storage-sqlite.workspace = true
totp-rs.workspace = true

[[test]]
name = "bff_it"
path = "tests/bff_it.rs"

[[test]]
name = "bff_slow"
path = "tests/bff_slow.rs"

# The conformance suites stay crate roots: their generated code addresses `crate::harness`.
[[test]]
name = "contract_conformance"
path = "tests/contract_conformance.rs"

[[test]]
name = "contract_conformance_fixtures"
path = "tests/contract_conformance_fixtures.rs"

[lints]
workspace = true
