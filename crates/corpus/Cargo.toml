[package]
autotests = false
name = "strata-corpus"
description = "The enterprise tenant corpus: installs the 14 product files into one tenant and populates it with seeded records, for scale and working-set runs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "strata_corpus"
path = "src/lib.rs"

[[bin]]
name = "strata-corpus"
path = "src/main.rs"

[dependencies]
strata-kernel.workspace = true
strata-substrate.workspace = true
strata-storage-api.workspace = true
strata-storage-sqlite.workspace = true
strata-storage-postgres.workspace = true
strata-spec-parts.workspace = true
strata-spec-compiler = { path = "../spec-compiler" }
serde.workspace = true
serde_json.workspace = true

[[test]]
name = "corpus_slow"
path = "tests/corpus_slow.rs"

[lints]
workspace = true
