[package]
autotests = false
name = "strata-ws-bench"
description = "Working-set measurement harness: product scenarios over the enterprise corpus run against a store, with and without a resident layer, and a coherence check against an unwrapped handle."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "ws-bench"
path = "src/main.rs"

[dependencies]
# The testkit supplies the stub tenant (`corpus::NotesLoader`) until the corpus loader is wired in.
strata-kernel = { workspace = true, features = ["testkit"] }
strata-storage-api.workspace = true
strata-storage-sqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[[test]]
name = "ws_bench_it"
path = "tests/ws_bench_it.rs"

[lints]
workspace = true
