# Runs the specification gate (scripts/spec-gate.mjs) on every push and pull request: the generated
# files are current, cargo test, lake build, the web and script tests, the type check, cargo fmt,
# cargo clippy, cargo audit, npm audit, Exegra, the requirement-to-evidence check, and the three browser suites.
# --require-all makes a tool that is missing a failure, never a silent pass.
#
# One job, one build. What it relies on:
#
#   the Exegra repository          BriceKrispies/exegra is public, so it is checked out with the
#                                  workflow's own token. The gate validates the specification with it.
#   the Exegra project "strata"    created by the gate itself: scripts/spec-hash.mjs (checkoutSpecs)
#                                  writes var/exegra-specs/strata/project.jsonc pointing at this
#                                  checkout's specification and passes --specs on every Exegra call,
#                                  so no registration inside the Exegra checkout is needed.
#   elan and Lean                  installed below; lake reads lean/lean-toolchain.
#   cargo-audit and Chromium       installed below. npm audit and cargo audit need network access.
name: gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      CARGO_TERM_COLOR: never
      EXEGRA_HOME: ${{ github.workspace }}/exegra
      EXEGRA_PROJECT: strata
    steps:
      - uses: actions/checkout@v5

      - uses: actions/checkout@v5
        with:
          repository: BriceKrispies/exegra
          path: exegra

      - uses: actions/setup-node@v5
        with:
          # Exegra's Lean core is wasm64 (memory64), which Node runs from version 24.
          node-version: 24
          cache: npm

      - name: Rust toolchain from rust-toolchain.toml
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Tools the gate runs
        run: |
          cargo install cargo-audit --locked
          curl -sSf https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Dependencies
        run: |
          npm ci
          npm ci --prefix exegra
          npx playwright install --with-deps chromium

      # Exegra's engine and its Lean core (src/engine/lean/exegra-lean.wasm) are build products the
      # Exegra repository does not commit. The wasm build downloads emsdk and the Lean runtime sources
      # into ~/.cache/exegra/formal-wasm; both that cache and formal/.lake are kept between runs.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/exegra/formal-wasm
            exegra/formal/.lake
          key: exegra-formal-wasm-${{ runner.os }}-${{ hashFiles('exegra/formal/lean-toolchain', 'exegra/formal/lake-manifest.json', 'exegra/tools/build-formal-wasm.js', 'exegra/formal/wasm/**') }}
          restore-keys: exegra-formal-wasm-${{ runner.os }}-

      - name: Build Exegra's engine and Lean core
        run: |
          npm run build:engine --prefix exegra
          npm run build:formal-wasm --prefix exegra

      # The correspondence tests in crates/verification run `lake exe strata_model` while cargo test
      # runs; on a fresh runner that first call would also install the toolchain and build the model.
      - name: Build the Lean model
        working-directory: lean
        run: |
          lake build
          lake build strata_model

      - name: Gate
        run: node scripts/spec-gate.mjs --browser --require-all

      - name: Keep the gate's run records and browser reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-runs
          path: |
            var/runs
            test-results
            playwright-report
          if-no-files-found: ignore
