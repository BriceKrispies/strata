[workspace]
resolver = "2"
members = [
    "crates/kernel",
    "crates/substrate",
    "crates/storage-api",
    "crates/storage-sqlite",
    "crates/runtime",
    "crates/machine-store",
    "crates/protocol",
    "crates/backend",
    "crates/bff",
    "crates/simulation",
    "crates/verification",
    "crates/spec-compiler",
    "crates/spec-compiler-fixture",
    "crates/spec-compiler-machines-fixture",
    "crates/spec-compiler-wiring-fixture",
    "crates/spec-compiler-core-fixture",
    "crates/spec-compiler-language-fixture",
    "crates/spec-compiler-functions-fixture",
    "crates/spec-compiler-derived-fixture",
    "crates/spec-expr",
    "crates/spec-expr-cases",
    "crates/model",
    "crates/model-core",
    "crates/system-differential",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
publish = false

[workspace.dependencies]
strata-kernel = { path = "crates/kernel" }
strata-substrate = { path = "crates/substrate" }
strata-storage-api = { path = "crates/storage-api" }
strata-storage-sqlite = { path = "crates/storage-sqlite" }
strata-runtime = { path = "crates/runtime" }
strata-machine-store = { path = "crates/machine-store" }
strata-protocol = { path = "crates/protocol" }
strata-simulation = { path = "crates/simulation" }
strata-verification = { path = "crates/verification" }
strata-spec-expr = { path = "crates/spec-expr" }
strata-model = { path = "crates/model" }
strata-model-core = { path = "crates/model-core" }

serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = "1.0.146"
sha2 = "0.10.9"
proptest = "1.12.0"
rusqlite = { version = "0.32.1", features = ["bundled"] }
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
axum = { version = "0.7.9", features = ["ws", "macros"] }
tokio-tungstenite = "0.24.0"
futures-util = "0.3.31"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
argon2 = "0.5.3"
getrandom = "0.2.16"
tower-http = { version = "0.6.8", features = ["fs"] }
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = { version = "2.0.119", features = ["full"] }
prettyplease = "0.2.37"
regex = "1.13.1"
uuid = { version = "1.24.0", features = ["serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2

[workspace.lints.clippy]
# A rejection carries the whole evidence trail by design; it is returned rarely and by value.
result_large_err = "allow"
too_many_arguments = "allow"
type_complexity = "allow"
